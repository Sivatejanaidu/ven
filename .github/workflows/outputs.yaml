name: pass outputs

on:
 push: 
  branches:
    - develop
 workflow_dispatch:
 
jobs:
  passout:
    runs-on: ubuntu-latest
    outputs:
      output1: ${{ steps.step1.outputs.ImageTag }}
    steps:
    - name: image tag
      id: tag1
      run: echo "ImageTag=1.0.5" >> "$GITHUB_OUTPUT"
	
  accessoutputs:
   runs-on: ubuntu-latest
   needs: passout
   steps:
   - name: access outputs
     run: echo "tag version of image is ${{needs.passout.outputs.output1}}"
      