name: Call a reusable workflow

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    
jobs:
  call-workflow:
    uses: ./.github/workflows/dockertest.yaml
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD}}

  deploy:
    runs-on : ubuntu-latest
    needs: call-workflow
    steps:
    - name: deploy
      run: echo "Deploying the application..."