name: docker test
on:
  workflow_call:
    secrets:
      DOCKER_PASSWORD:
        required: true
    outputs:
     ImageTag:
       description: 'Image Tag'
       value: ${{ jobs.docker.outputs.imagetag }}
jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      imagetag: ${{ steps.tag1.outputs.ImageTag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3 

    - name: docker login
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME}}
        password: ${{ secrets.DOCKER_PASSWORD}}   

    - name: output image tag
      id: tag1
      run: echo "ImageTag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"        

    - name: Build Image
      run: docker build -t businessnext-app:${{ steps.tag1.outputs.ImageTag }} .

    - name: Tag image
      run: docker tag businessnext-app sivatejanaidu78/businessnext-app:${{ steps.tag1.outputs.ImageTag }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'businessnext-app:${{ steps.tag1.outputs.ImageTag }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH,MEDIUM,LOW'

    - name: push images
      run: docker push sivatejanaidu78/businessnext-app:${{ steps.tag1.outputs.ImageTag }}
      
    - name: image size
      run: docker images  
 


