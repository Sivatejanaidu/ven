name: docker test
on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3 

    - name: docker login
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USERNAME}}
        password: ${{ secrets.DOCKER_PASSWORD}}   

    - name: Build Image
      run: docker build -t my-image .

    - name: Tag image
      run: docker tag my-image sivatejanaidu78/latest

    - name: push images
      run: docker push sivatejanaidu78/latest

    - name: image size
      run: docker images


