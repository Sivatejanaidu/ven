name: docker test
on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3 

    - name: Build Image
      run: docker build -t my-image .

    - name: Tag image
      run: docker tag my-image my-image:latest

    - name: image size
      run: docker images ls  